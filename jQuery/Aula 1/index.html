<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery cfb cursos</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
</head>
<body>
    
    <p>teste</p>

    <script>

        // jQuery e $ fazem a mesma coisa
        jQuery("p").css("color","#f00"); // Seleciona uma tag (todos os elementos "p") em questão e muda as suas própriedades css
        $("p").css("color","#f00"); // O "$" é um indicativo/abreviação do jQuery

    </script>

</body>
</html>
